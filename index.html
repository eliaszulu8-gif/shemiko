<style>
/* Layout: one phone-width column, four tabs + add button on a bottom bar, bottom sheets for entry. Indigo cloth + millet gold. */
:root{
  --bg:#ECEEE6; --surface:#F8F9F4; --line:#D5D9CB; --ink:#1C2540; --muted:#5D6578;
  --indigo:#2B3A82; --on-indigo:#FFFFFF; --gold:#C98A12; --gold-soft:#F3E3BC; --good:#2F7D4F; --bad:#B23B2E; --warn:#9A6700;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12162A; --surface:#1B2038; --line:#2E3554; --ink:#E7E9F2; --muted:#9AA1B8;
  --indigo:#93A4F5; --on-indigo:#12162A; --gold:#E7B24A; --gold-soft:#3A3120; --good:#5EC08A; --bad:#EE7D70; --warn:#E7B24A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12162A; --surface:#1B2038; --line:#2E3554; --ink:#E7E9F2; --muted:#9AA1B8;
  --indigo:#93A4F5; --on-indigo:#12162A; --gold:#E7B24A; --gold-soft:#3A3120; --good:#5EC08A; --bad:#EE7D70; --warn:#E7B24A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:460px;margin:0 auto;padding-block:16px 110px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.7rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:.85rem}

.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.status.off i{background:var(--warn)}
.tools{display:flex;gap:6px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;font:700 .78rem var(--body);padding:5px 10px;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--indigo);color:var(--on-indigo)}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;font:700 .78rem var(--body);padding:5px 11px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.iconbtn svg{width:14px;height:14px}
header.top{display:flex;flex-direction:column;gap:2px}
.demo{font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo button{background:none;border:0;color:var(--indigo);font:inherit;font-weight:700;padding:0;cursor:pointer;text-decoration:underline}

.net{background:var(--indigo);color:var(--on-indigo);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.net .big{font-family:var(--display);font-size:2.3rem;font-weight:800;line-height:1}
.net .big small{font-size:.9rem;font-weight:500;opacity:.8;margin-left:6px}
.net .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:.85rem}
.net .row div{display:flex;flex-direction:column;min-width:0}
.net .row b{font-family:var(--mono);font-size:1rem}
.net .eyebrow{color:inherit;opacity:.78}

section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.link{background:none;border:0;color:var(--indigo);font:700 .85rem var(--body);cursor:pointer;padding:4px 0}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700;overflow-wrap:anywhere}
.item .s{font-size:.82rem;color:var(--muted)}
.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.92rem;white-space:nowrap}
.amt.in{color:var(--good)}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;flex:none;display:grid;place-items:center;color:transparent}
.tick:hover{border-color:var(--indigo)}
.tick.on{background:var(--good);border-color:var(--good);color:#fff}
.done .t{text-decoration:line-through;color:var(--muted)}
.due{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.due.late{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.due.soon{background:var(--gold-soft);color:var(--warn)}
.due.later{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted)}
.due.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}

.plots{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .ttl{font-family:var(--display);font-weight:700;font-size:1.1rem}
.card .meta{font-size:.82rem;color:var(--muted)}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.stages span{height:8px;border-radius:2px;background:var(--line)}
.stages span.on{background:var(--gold)}
.stages span.cur{background:var(--indigo)}
.stagelbl{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
.stagelbl b{color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv b{font-family:var(--mono);font-size:.86rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pos{color:var(--good)} .neg{color:var(--bad)}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--good)}

.bars{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;font-size:.82rem}
.bar-row .lbl{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{display:flex;flex-direction:column;gap:3px}
.track i{display:block;height:9px;border-radius:2px;min-width:2px}
.track i.c{background:var(--muted);opacity:.55}
.track i.r{background:var(--gold)}
.legend{display:flex;gap:16px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend .c::before{background:var(--muted);opacity:.55}
.legend .r::before{background:var(--gold)}
.legend .b::before{background:none;border:2px solid var(--ink);width:6px;height:6px}

.budget-row{display:flex;flex-direction:column;gap:5px}
.budget-row .top{display:flex;justify-content:space-between;font-size:.85rem;gap:8px}
.budget-row .top b{font-weight:700}
.btrack{position:relative;height:12px;border-radius:3px;background:var(--line);overflow:visible}
.btrack i{display:block;height:100%;border-radius:3px;background:var(--indigo)}
.btrack i.over{background:var(--bad)}
.btrack u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--body);font-weight:700}
tr.total td{font-weight:700;background:color-mix(in srgb,var(--gold) 10%,transparent)}

.score{display:flex;gap:14px;align-items:center}
.ring{width:72px;height:72px;flex:none}
.score ul{margin:0;padding-left:18px;font-size:.82rem;color:var(--muted)}

.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 2px;border-radius:8px;font:700 .78rem var(--body);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--indigo);color:var(--on-indigo)}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:.9rem}

.say{display:flex;gap:8px;align-items:stretch}
.say input{flex:1;min-width:0;font:16px var(--body);padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.mic{width:48px;flex:none;border-radius:12px;border:0;background:var(--gold);color:#1C2540;cursor:pointer;display:grid;place-items:center}
.mic svg{width:22px;height:22px}
.mic.live{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--gold) 35%,transparent)}}
.hint{font-size:.8rem;color:var(--muted)}
.hint code{font-family:var(--mono);font-size:.78rem;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 4px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr) 64px repeat(2,1fr);align-items:center}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 .72rem var(--body);color:var(--muted);cursor:pointer;padding:6px 0}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--indigo)}
nav.tabs .fab{width:54px;height:54px;border-radius:50%;background:var(--gold);color:#1C2540;justify-self:center;justify-content:center;margin-top:-26px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
nav.tabs .fab svg{width:26px;height:26px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.scrim{position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:9}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-radius:20px 20px 0 0;max-height:90vh;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.8rem;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{font:16px var(--body);padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.field textarea{font:13px/1.45 var(--mono);min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:13px;font:700 1rem var(--body);cursor:pointer;background:var(--indigo);color:var(--on-indigo)}
.btn.ghost{background:none;color:var(--muted)}
.btn.small{padding:8px 12px;font-size:.85rem;border-radius:10px}
.btn.line{background:none;border:1px solid var(--line);color:var(--ink)}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}
.sms{display:flex;flex-direction:column;gap:8px}
.sms .msg{background:var(--bg);border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:10px 12px;font:12.5px/1.45 var(--mono);overflow-wrap:anywhere;display:flex;flex-direction:column;gap:6px}
.sms .msg .row{display:flex;justify-content:space-between;align-items:center;font-family:var(--body);font-size:.75rem;color:var(--muted)}
.modes button{display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:.85rem;padding:10px 2px}
.modes svg{width:18px;height:18px}
.eggbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px}
.eb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:.72rem}
.eb i{display:block;width:100%;background:var(--gold);border-radius:3px 3px 0 0;min-height:2px}
.eb em{font-style:normal;color:var(--muted)}
.curopt{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.curopt:first-child{border-top:0}
.curopt .code{font-family:var(--mono);font-size:.85rem;font-weight:500}
.curopt .sy{color:var(--muted);font-size:.85rem}
.curopt.on{background:var(--gold-soft)}
.curopt.on .code::before{content:"✓ "}
.cmds{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.84rem}
.cmds code{font-family:var(--mono);font-size:.8rem;font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:.9rem;z-index:11;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none;outline:3px solid var(--gold)}}
</style>

</head>

function forecast(){
  const months=[]; for(let i=0;i<4;i++){ const d=new Date(TODAY.getFullYear(),TODAY.getMonth()+i,1); months.push({key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),label:monthLabel(d),inn:0,out:0}); }
  const mk = ds => ds.slice(0,7); const find = k => months.find(m=>m.key===k);
  S.plots.forEach(p=>{
    const c=CROPS[p.crop], st=stageOf(p), value=c.yield*p.ha*1000*c.price, sold=plotMoney(p.id).r, rest=Math.max(0,value-sold);
    const when = st.idx===4 ? addDays(14) : addDays(14,new Date(st.harvest+'T12:00:00'));
    const m=find(mk(when)); if(m) m.inn+=rest;
  });
  (S.flocks||[]).forEach(f=>{ const T=PTYPES[f.type], s=flockStats(f);
    if(f.type==='layer'){ months.forEach((m,i)=>{ const y=+m.key.slice(0,4), mo=+m.key.slice(5,7), dim=new Date(y,mo,0).getDate();
        const startDay = i===0 ? TODAY.getDate() : 1; const layStart=new Date(s.endDate+'T12:00:00');
        let n=0; for(let d=startDay; d<=dim; d++){ if(new Date(y,mo-1,d)>=layStart) n++; }
        const rate = s.idx>=3 && s.lay>0 ? s.lay : T.layRate; m.inn += s.alive*rate*n*T.eggPrice; }); }
    else if(!s.sold && s.alive){ const when = s.toEnd===0 ? addDays(7) : s.endDate; const m=find(mk(when)); if(m) m.inn += s.alive*T.birdPrice; }
  });
  months[0].out += (S.work||[]).reduce((a,j)=>a+jobOwed(j),0);
  S.loans.forEach(l=>{ const L=loanCalc(l); if(!L.left) return; const k=mk(l.due)<months[0].key?months[0].key:mk(l.due); const m=find(k); if(m) m.out+=L.left; });
  const cbc=costByCat(S.records.filter(r=>entOf(r)==='crop')), cbp=costByCat(S.records.filter(r=>entOf(r)==='poultry')); let remain=0;
  COSTS.forEach(k=>remain+=Math.max(0,((S.budget||{})[k]||0)-(cbc[k]||0))); PCOSTS.forEach(k=>remain+=Math.max(0,((S.budgetP||{})[k]||0)-(cbp[k]||0)));
  months[0].out+=remain*0.5; months[1].out+=remain*0.5;
  const loansIn = S.loans.reduce((a,l)=>a+l.principal,0), repaid = S.loans.reduce((a,l)=>a+loanCalc(l).paid,0);
  const cash = totals().net + loansIn - repaid;
  let bal=cash; months.forEach(m=>{bal+=m.inn-m.out; m.bal=bal;});
  return {months,cash};
}
function score(){
  const ms=new Set(S.records.map(r=>r.date.slice(0,7))); const first=S.records.reduce((m,r)=>r.date<m?r.date:m,iso(TODAY)); const span=Math.max(1,(TODAY.getFullYear()-+first.slice(0,4))*12+TODAY.getMonth()+1-+first.slice(5,7)+1);
  const a=Math.min(1,ms.size/span);
  const paidLoans=S.loans.filter(l=>l.repaid.length); const b=S.loans.length? S.loans.filter(l=>loanCalc(l).left===0 || -daysSince(l.due)>=0).length/S.loans.length : 1;
  const c=totals().net>0?1:0.3; const d=Object.values(S.budget||{}).some(v=>v>0)?1:0;
  return {total:Math.round(a*35+b*35+c*20+d*10), parts:[a,b,c,d]};
}

function toast(msg){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),2600); }

/* ---------- Sentence / SMS-command parser ---------- */
function parseSentence(raw){
  const s = ' '+raw.toLowerCase().replace(/[’']/g,"'")+' ';
  const has = list => list.some(w => new RegExp('(^|[^a-z0-9à-ÿœ])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=$|[^a-z0-9à-ÿœ])').test(s));
  let type = null; const first = s.trim().split(/\s+/)[0];
  if(['dep','spend'].includes(first)) type='cost'; else if(['ven','sell'].includes(first)) type='sale'; else if(['tac','job'].includes(first)) type='task';
  if(!type){
    if(has(['sold','sell','selling','received','got paid','vendu','vendre','vente','reçu','recu','encaissé','avance','advance','deposit'])) type='sale';
    else if(has(['bought','buy','paid','pay','spent','cost','hired','acheté','achete','payé','paye','dépensé','depense','coûté','loué'])) type='cost';
    else if(has(['need to','must','remind','tomorrow','todo','il faut','faut','demain','rappel','à faire','a faire'])) type='task';
  }
  // amounts: "52 000", "52000", "52k", "50 mille"
  let amount=null; const nums=[];
  s.replace(/(\d[\d\s.,]*\d|\d)\s*(k|mille|thousand)?\b/g,(m,n,mult)=>{ let v=parseFloat(n.replace(/[\s.]/g,'').replace(',','.')); if(mult) v*=1000; nums.push({v,unit:/\b(kg|sacs?|bags?|ha)\b/.test(s.slice(s.indexOf(m)+m.length, s.indexOf(m)+m.length+6))}); return m;});
  const money = nums.filter(n=>!n.unit); if(money.length) amount=Math.max(...money.map(n=>n.v));
  let cat=null;
  const order = Object.keys(CATS); if(S.lang==='fr'){ order.splice(order.indexOf('plough'),1); order.unshift('plough'); }
  const kwFor = k => k==='plough'&&S.lang==='fr' ? [...CATS[k].kw,'labour'] : k==='labour'&&S.lang==='fr' ? CATS[k].kw.filter(w=>w!=='labour') : CATS[k].kw;
  for(const k of order) if(has(kwFor(k))){ cat=k; break; }
  if(!cat){ for(const k of order) if(has([CATS[k].code.toLowerCase()])){cat=k;break;} }
  let plot='';
  for(const p of S.plots){ const c=CROPS[p.crop]; if(has([c.en.toLowerCase(),c.fr.toLowerCase(),c.code.toLowerCase(),c.fr.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')])){ plot=p.id; break; } }
  if(!type) type = amount!=null ? 'cost' : 'task';
  const pw = has(['chick','chicks','chicken','chickens','broiler','broilers','layer','layers','egg','eggs','tray','trays','poultry','birds','poulet','poulets','poussin','poussins','pondeuse','pondeuses','œufs','oeufs','volaille','volailles']) || PCOSTS.slice(0,4).includes(cat);
  const ent = pw ? 'poultry' : (S.mode==='poultry' && !plot ? 'poultry' : 'crop');
  if(ent==='poultry'){
    plot=''; for(const f of (S.flocks||[])){ const T=PTYPES[f.type]; if(has([T.en.toLowerCase(), T.en.toLowerCase().replace(/s$/,''), T.fr.toLowerCase()])){ plot=f.id; break; } }
    if(!plot && has(['egg','eggs','tray','trays','œufs','oeufs'])){ const L=(S.flocks||[]).find(f=>f.type==='layer'); if(L) plot=L.id; }
    if(type==='sale') cat = has(['egg','eggs','tray','trays','œufs','oeufs']) ? 'eggSale' : 'birdSale';
    if(type==='cost' && !PCOSTS.includes(cat)) cat='other';
  } else {
    if(type==='sale' && !SALES.includes(cat)) cat = cat==='advance'?'advance':'harvest';
    if(type==='cost' && !COSTS.includes(cat)) cat='other';
  }
  let date=iso(TODAY); if(/\b(tomorrow|demain)\b/.test(s)) date=addDays(1); if(/\b(yesterday|hier)\b/.test(s)) date=addDays(-1);
  const note = raw.trim().slice(0,80);
  return {type,amount,cat,plot,date,note,ent,text:raw.trim().replace(/^(tac|job)\s+/i,'')};
}

/* ---------- Voice ---------- */
let rec=null;
function startVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const hint=document.getElementById('sayHint'), mic=document.getElementById('mic');
  if(!SR){ hint.textContent=t('micNo'); document.getElementById('say').focus(); return; }
  try{
    if(rec){ rec.stop(); return; }
    rec = new SR(); rec.lang = S.lang==='fr'?'fr-FR':'en-GB'; rec.interimResults=true; rec.maxAlternatives=1;
    mic.classList.add('live'); hint.textContent=t('listening');
    rec.onresult = e => { const txt=[...e.results].map(r=>r[0].transcript).join(' '); document.getElementById('say').value=txt; if(e.results[e.results.length-1].isFinal){ handleSay(txt); } };
    rec.onerror = () => { hint.textContent=t('micNo'); };
    rec.onend = () => { mic.classList.remove('live'); rec=null; };
    rec.start();
  }catch(err){ hint.textContent=t('micNo'); mic.classList.remove('live'); rec=null; }
}
function handleSay(txt){
  if(!txt.trim()) return;
  const P = parseSentence(txt);
  if(P.type!=='task' && P.amount==null){ document.getElementById('sayHint').textContent=t('noParse'); return; }
  sheet('record', P);
}

  el.innerHTML=`<div class="wrap">${html}</div>`; document.body.append(scrim,el);
  el.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);
  setTimeout(()=>el.querySelector('input:not([type=hidden]),select,textarea,button')?.focus(),60);

}

const cropByCode = c => Object.keys(CROPS).find(k=>CROPS[k].code===c);
const catByCode = c => Object.keys(CATS).find(k=>CATS[k].code===c);
const d6 = d => d.replace(/-/g,'').slice(2); // 2026-06-22 -> 260622
const unD6 = s => '20'+s.slice(0,2)+'-'+s.slice(2,4)+'-'+s.slice(4,6);
const clean = s => String(s||'').replace(/[|;~]/g,' ').slice(0,24);
function encode(){
  const pi = {}; S.plots.forEach((p,i)=>pi[p.id]=i+1); (S.flocks||[]).forEach((f,i)=>pi[f.id]=i+1);
  const F = (S.flocks||[]).map(f=>[clean(f.name),PTYPES[f.type].code,d6(f.start),f.birds,flockStats(f).deaths].join('~')).join(';');
  const P = S.plots.map(p=>[clean(p.name),CROPS[p.crop].code,p.ha,d6(p.planted)].join('~')).join(';');
  const R = S.records.map(r=>[d6(r.date),pi[r.plot]||0,(r.type==='cost'?'D':'V')+(entOf(r)==='poultry'?'P':''),CATS[r.cat].code,r.amount].join('~')).join(';');
  const L = S.loans.map(l=>[clean(l.lender),l.principal,l.rate,d6(l.start),d6(l.due),l.repaid.reduce((a,x)=>a+x.amount,0)].join('~')).join(';');
  const K = S.tasks.filter(x=>!x.done).map(x=>[d6(x.date),pi[x.plot]||0,clean(x.text),x.ent==='poultry'?'P':''].join('~')).join(';');
  const B = COSTS.map(k=>(S.budget||{})[k]||0).join('~');
  const Q = PCOSTS.map(k=>(S.budgetP||{})[k]||0).join('~');
  const body = `P${P}|F${F}|R${R}|L${L}|K${K}|B${B}|Q${Q}`;
  const size = 140, parts=[]; for(let i=0;i<body.length;i+=size) parts.push(body.slice(i,i+size));
  return parts.map((p,i)=>`SHM3 ${i+1}/${parts.length} ${p}`);
}
function decode(text){
  const segs = [...text.matchAll(/SHM3 (\d+)\/(\d+) ([^\n]*)/g)].map(m=>({i:+m[1],n:+m[2],b:m[3]}));
  if(!segs.length) throw 0; const n=segs[0].n; const got={}; segs.forEach(s=>got[s.i]=s.b);
  for(let i=1;i<=n;i++) if(got[i]==null) throw 0;
  const body = Array.from({length:n},(_,i)=>got[i+1]).join('');
  const sec = {}; body.split('|').forEach(s=>sec[s[0]]=s.slice(1));
  const rows = s => s? s.split(';').map(r=>r.split('~')) : [];
  const plots = rows(sec.P).map((r,i)=>({id:'p'+(i+1),name:r[0],crop:cropByCode(r[1])||'maize',ha:+r[2],planted:unD6(r[3])}));
  const flocks = rows(sec.F).map((r,i)=>({id:'f'+(i+1),name:r[0],type:Object.keys(PTYPES).find(k=>PTYPES[k].code===r[1])||'broiler',start:unD6(r[2]),birds:+r[3],logs:+r[4]?[{date:unD6(r[2]),deaths:+r[4],feed:0,eggs:0}]:[]}));
  const records = rows(sec.R).map(r=>{ const pp=r[2].endsWith('P'); return {id:id(),ent:pp?'poultry':'crop',date:unD6(r[0]),plot:+r[1]?(pp?'f':'p')+r[1]:'',type:r[2][0]==='D'?'cost':'sale',cat:catByCode(r[3])||'other',amount:+r[4],note:''}; });
  const loans = rows(sec.L).map(r=>({id:id(),lender:r[0],principal:+r[1],rate:+r[2],start:unD6(r[3]),due:unD6(r[4]),repaid:+r[5]?[{date:unD6(r[3]),amount:+r[5]}]:[]}));
  const tasks = rows(sec.K).map(r=>({id:id(),ent:r[3]==='P'?'poultry':'crop',date:unD6(r[0]),plot:+r[1]?(r[3]==='P'?'f':'p')+r[1]:'',text:r[2],done:false}));
  const bv = (sec.B||'').split('~'); const budget={}; COSTS.forEach((k,i)=>budget[k]=+bv[i]||0);
  const qv = (sec.Q||'').split('~'); const budgetP={}; PCOSTS.forEach((k,i)=>budgetP[k]=+qv[i]||0);
  if(!plots.length && !records.length && !flocks.length) throw 0;
  return {plots,flocks,records,loans,tasks,budget,budgetP};
}
async function copyText(txt, btn){
  try{ await navigator.clipboard.writeText(txt); btn.textContent=t('copied'); }
  catch(e){ const pre=btn.closest('.msg')?.querySelector('.body'); if(pre){ const r=document.createRange(); r.selectNodeContents(pre); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} toast(t('copyFail')); }
}

    <button type="button" class="btn ghost" data-close>${t('cancel')}</button>`);
  el.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(msgs[+b.dataset.copy],b));
  el.querySelector('#markSent').onclick=()=>{ S.lastBackup=iso(TODAY); done(t('markedDone')); };
  el.querySelector('#doRestore').onclick=()=>{ try{ const d=decode(el.querySelector('#restoreTxt').value); Object.assign(S,d,{example:false}); tab='today'; done(t('restored')); } catch(e){ el.querySelector('#rErr').textContent=t('restoreErr'); } };
}

/* ---------- Events ---------- */
let armed=false;
document.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b || b.closest('.sheet')) return;
  if(b.dataset.tab){ tab=b.dataset.tab; render(); scrollTo(0,0); }
  else if(b.dataset.go){ tab=b.dataset.go; render(); scrollTo(0,0); }
  else if(b.dataset.mode){ S.mode=b.dataset.mode; save(); render(); }
  else if(b.dataset.log!==undefined) sheet('log', b.dataset.log||null);
  else if(b.id==='addFlock') sheet('flock');
  else if(b.id==='addWorker') sheet('worker');
  else if(b.dataset.member) sheet('member', b.dataset.member);
  else if(b.id==='addMember') sheet('addMember');
  else if(b.id==='addEquip') sheet('equip');
  else if(b.dataset.service) sheet('service', b.dataset.service);
  else if(b.dataset.cal){ calTab=b.dataset.cal; render(); }
  else if(b.id==='startChk') sheet('startChk');
  else if(b.dataset.chk){ const [rid,i]=b.dataset.chk.split(':'); const r=(S.runs||[]).find(x=>x.id===rid); if(r){ const n=+i; r.checked = r.checked.includes(n) ? r.checked.filter(x=>x!==n) : [...r.checked,n]; const all=r.checked.length>=tplOf(r).items.length; save(); render(); if(all) toast(t('chkDone')); } }
  else if(b.dataset.again){ S.runs=S.runs||[]; S.runs.push({id:id(),tpl:b.dataset.again,ent:S.mode||'crop',date:iso(TODAY),checked:[]}); save(); render(); toast(t('chkStarted')); }
  else if(b.dataset.work!==undefined) sheet('work', b.dataset.work);
  else if(b.dataset.pay!==undefined) sheet('pay', b.dataset.pay);
  else if(b.dataset.lang){ S.lang=b.dataset.lang; save(); render(); }
  else if(b.dataset.fin){ finTab=b.dataset.fin; render(); }
  else if(b.dataset.filter){ moneyFilter=b.dataset.filter; render(); }
  else if(b.dataset.tick){ const x=S.tasks.find(q=>q.id===b.dataset.tick); x.done=!x.done; save(); render(); }
  else if(b.dataset.repay) sheet('repay', b.dataset.repay);
  else if(b.id==='fab') sheet(isC()?'addMember':'record');
  else if(b.id==='addPlot') sheet('plot');
  else if(b.id==='addLoan') sheet('loan');
  else if(b.id==='editBudget') sheet('budget');
  else if(b.id==='bk') sheet('backup');
  else if(b.id==='curBtn') sheet('currency');
  else if(b.id==='mic') startVoice();
  else if(b.id==='clear'){
    if(!armed){ armed=true; b.textContent=t('confirmClear'); setTimeout(()=>{armed=false; render();},4000); return; }
    armed=false; S={lang:S.lang,currency:S.currency,mode:S.mode,plots:[],flocks:[],records:[],tasks:[],loans:[],workers:[],work:[],equipment:[],runs:[],customTpls:[],budget:{},budgetP:{},example:false,lastBackup:null}; save(); tab='plots'; render(); toast(t('cleared'));
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeSheet();
  if(e.key==='Enter' && e.target.id==='say'){ e.preventDefault(); handleSay(e.target.value); }
});
addEventListener('online',render); addEventListener('offline',render);
render();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
